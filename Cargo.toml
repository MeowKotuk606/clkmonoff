[package]
name = "clkmonoff"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"

[profile.release.build-override]
opt-level = "z"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1.0.35"
tar = "0.4.46"
rfd = "0.17.2"
libc = "0.2.186"
zbus = "5.16.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [ "Win32_Foundation", "Win32_System", "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging", "Win32_Graphics", "Win32_Graphics_Gdi", "Win32_System_SystemServices",
    "Win32_System_Power", "Win32_UI", "Win32_UI_Accessibility", "Win32_Devices", "Win32_Devices_Display",
    "Win32_System_Com", "Win32_Media", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant", "Media", "Media_Control"] }

[target.'cfg(target_os = "linux")'.build-dependencies]
flate2 = "1.0.35"
tar = "0.4.46"
sha2 = "0.11.0"